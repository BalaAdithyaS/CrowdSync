version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: crowdsync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crowdsync_db
      POSTGRES_USER: crowdsync
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdsync -d crowdsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crowdsync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowdsync_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crowdsync:secret_password@db:5432/crowdsync_db
      SECRET_KEY: crowdsync-super-secret-development-key-change-in-production-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      APP_NAME: CrowdSync
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173"]'
      DEMO_MODE: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crowdsync_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
