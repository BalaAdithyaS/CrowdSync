services:
  # CrowdSync FastAPI Backend Web Service
  - type: web
    name: crowdsync-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crowdsync-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_MODE
        value: "true"

databases:
  # Managed PostgreSQL Database for CrowdSync
  - name: crowdsync-db
    plan: free
    databaseName: crowdsync_db
    user: crowdsync
